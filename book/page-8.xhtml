<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>8 Page 8 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:36.004px;top:8.904px;width:347.992px;height:577.192px;"><img src="images/image-14.png" alt="Love overcomes… Love overcomes&#10;&#9;Life got rocky. We’ve all done stupid things,&#10;I’ve done some stupid things.   A lot of stupid things.&#10;One thing tested our marriage to the point that I almost lost the most precious thing in my life… Missy… she forgave me and made it clear that Her love and grace and patience was a  VERY SPECIAL trait. It goes to show how much she loved me, more than I loved her… It scared me into the man I needed to be and the Husband SHE NEEDED me to be.. She’s stuck with me all these years. And we’ve been Happily married for 44 years… &#10;(at the time of this writing in 2026)&#10;&#9; Today we have eight Gorgeous grandchildren. &#10;I have two awesome Sons-in-laws and one beautiful &#10;daughter-in-law that only God can give a man.&#10;&#9;GOD sent everyone of our Babies Spouses along  with their beautiful families that add to ours..&#10;God’s Power once again on display…&#10;&#10;&#10;&#10;&#10;" style="width:347.992px;height:577.192px;"/></span></p><div style="position:absolute;left:36.004px;top:8.904px;width:347.992px;height:577.192px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">Love overcomes</p><p class="p8 c1" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span class="c2 c3" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">Life got rocky. We’ve all done stupid things,</span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">I’ve done some stupid things.   A lot of stupid </p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">things.</p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">One thing tested our marriage to the point that I </p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;">almost lost the most precious thing in my life… </p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">Missy… she forgave me and made it clear that Her </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">love and grace and patience was a  VERY SPECIAL </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">trait. It goes to show how much she loved me, </p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;">more than I loved her… It scared me into the man I </p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">needed to be and the Husband SHE NEEDED me to </p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">be.. She’s stuck with me all these years. And we’ve </p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;">been Happily married for 44 years… </p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">(at the time of this writing in 2026)</p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi> Today we have eight Gorgeous grandchildren. </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">I have two awesome Sons-in-laws and one beautiful </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">daughter-in-law that only God can give a man.</p><p class="p8" style="position:absolute;left:4.000px;top:422.312px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>GOD sent everyone of our Babies Spouses </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:446.284px;">along  with their beautiful families that add to </p><p class="p8" style="position:absolute;left:4.000px;top:470.256px;">ours..</p><p class="p8 p15" style="position:absolute;left:4.000px;top:494.228px;">God’s Power once again on display…</p><p class="p8 c1" style="position:absolute;left:4.000px;top:520.598px;"> </p></div></div></body></html>
