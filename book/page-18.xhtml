<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>18 Page 18 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:30.461px;top:180.773px;width:359.078px;height:369.652px;"><img src="images/image-22.png" alt="I was 24, I had a daughter that was 2 years old, and I had a son that was just born in September. And I remember cried like a little baby, and my heart was crying out… then I felt like Jesus sat… &#9;I was 24, I had a daughter that was 2 years old, and I had a son that was just born in September. And I remember cried like a little baby, and my heart was crying out… then I felt like Jesus sat&#10;next to me saying it’s all good.…&#10;&#9;One thing that stands out in my mind today was when I got back to the pew that I was sitting at, I took that little baby that was in my arms, and I held him up to the sky in the church, and I told him, I said, “Things are going to be diﬀerent from now on.”&#10;&#9;I had no idea what I was saying, but I just knew what I felt.&#10;And from that day, God began to show me the life that I was living and the life that I needed to live.&#10;&#9;Well, they were two diﬀerent lifestyles." style="width:359.078px;height:369.652px;"/></span></p><div style="position:absolute;left:30.461px;top:180.773px;width:359.078px;height:369.652px;"><p class="p8" style="position:absolute;left:4.000px;top:4.000px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I was 24, I had a daughter that was 2 years old, </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:27.972px;">and I had a son that was just born in September. And </p><p class="p8" style="position:absolute;left:4.000px;top:51.944px;">I remember cried like a little baby, and my heart was </p><p class="p8" style="position:absolute;left:4.000px;top:75.916px;">crying out… then I felt like Jesus sat</p><p class="p8" style="position:absolute;left:4.000px;top:99.888px;">next to me saying it’s all good.…</p><p class="p8" style="position:absolute;left:4.000px;top:123.860px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>One thing that stands out in my mind today was </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:147.832px;">when I got back to the pew that I was sitting at, I </p><p class="p8" style="position:absolute;left:4.000px;top:171.804px;">took that little baby that was in my arms, and I held </p><p class="p8" style="position:absolute;left:4.000px;top:195.776px;">him up to the sky in the church, and I told him, I </p><p class="p8" style="position:absolute;left:4.000px;top:219.748px;">said, “Things are going to be diﬀerent from now on.”</p><p class="p8" style="position:absolute;left:4.000px;top:243.720px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I had no idea what I was saying, but I just knew </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:267.692px;">what I felt.</p><p class="p8" style="position:absolute;left:4.000px;top:291.664px;">And from that day, God began to show me the life </p><p class="p8" style="position:absolute;left:4.000px;top:315.636px;">that I was living and the life that I needed to live.</p><p class="p8" style="position:absolute;left:4.000px;top:339.608px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>Well, they were two diﬀerent lifestyles.</bdi></p></div><div style="display:none;left:51.202px;top:20.738px;width:302.889px;height:197.950px;" dir="ltr" id="gallery-9" class="gallery" data-current-item-index="0" aria-label="Image gallery" role="group"><div style="left:0;top:0;width:302.889px;height:145.950px;" class="gallery-image-viewfinder"><div class="gallery-image-roll"><div class="gallery-image-cropper"><span style="left:0;top:-27.988px;width:302.889px;height:201.926px;background-image:url(images/Pineland_achurch.png);" class="gallery-full-image" aria-label="" role="img"> </span></div></div><span style="display:block;border-radius:15px;outline-offset:-4px;" class="gallery-button-goToPrev" aria-label="Previous image" role="button"/><span style="display:block;border-radius:15px;outline-offset:-4px;" class="gallery-button-goToNext" aria-label="Next image" role="button"/></div><div style="left:0;top:151.950px;width:302.889px;height:26.000px;" class="gallery-caption-viewfinder"><div class="gallery-caption-roll"><div class="gallery-caption"/></div></div><div style="left:5.000px;top:171.950px;width:292.889px;height:26.000px;" class="gallery-dot-container"><div class="gallery-dot-inner-container" aria-label="Page control" role="radiogroup"><span class="gallery-dot-extender"><span style="" class="gallery-dot-selectable" aria-checked="true" role="radio"/></span></div></div><div class="ax-announcement-region" aria-atomic="true" aria-live="assertive"/></div><div style="left:51.202px;top:20.738px;width:302.889px;height:197.950px;" dir="ltr" id="gallery-fallback-9" class="gallery-fallback" aria-label="Image gallery" role="group"><div style="left:0;top:0;width:302.889px;height:193.950px;" class="gallery-item-container"><div class="gallery-item"><div class="gallery-image-cropper"><span style="left:0;top:-27.988px;width:302.889px;height:201.926px;background-image:url(images/Pineland_achurch.png);" class="gallery-full-image" aria-label="" role="img"> </span></div><div class="gallery-caption"/></div></div></div></div></body></html>
