<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>5 Page 5 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:35.777px;top:13.885px;width:348.445px;height:567.230px;"><img src="images/image-10.png" alt="Childhood &amp; 1st Love… Childhood &amp; 1st Love&#10;&#9;I remember when Daddy first got out of service and we moved back to Mama’s hometown,&#10; Westlake, Louisiana, in 1975.  I began to go to school in Westlake, Louisiana, at S.P. Arnett, which was the seventh and eighth grade.&#10;&#9;I met a guy named Rodney Dinger who turned&#10;out to be my best friend later in life. And then something happened.      I met his little sister, “Missy”  Melissa was her real name.. &#10;Brown and Brown eyes…&#10;Cute as a button, And I fell in love. (possibly 1977)&#10;&#9;That was my first real love, that was my Missy&#10;There’s another story to tell behind that as well, though, ’cause I was dating another girl a few years later who had actually gone overseas as an exchange student.      This was 1981 I think.&#10;&#9;I remember as clear as today, for whatever reason but I wasn’t saved then, but I really had this passion for Missy. I really loved her, and I really felt way down deep in my heart that she would be my wife.&#10;&#9;You know when you got it bad….&#10;" style="width:348.445px;height:567.230px;"/></span></p><div style="position:absolute;left:35.777px;top:13.885px;width:348.445px;height:567.230px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">Childhood &amp; 1st Love</p><p class="p8 c1" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span class="c2 c3" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">I remember when Daddy first got out of </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">service and we moved back to Mama’s hometown,</p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;"> Westlake, Louisiana, in 1975.  I began to go to </p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">school in Westlake, Louisiana, at S.P. Arnett, which </p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;">was the seventh and eighth grade.</p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I met a guy named Rodney Dinger who turned</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">out to be my best friend later in life. And then </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">something happened.      I met his little sister, </p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;">“Missy”  Melissa was her real name.. </p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">Brown and Brown eyes…</p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">Cute as a button, And I fell in love. (possibly 1977)</p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>That was my first real love, that was my Missy</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">There’s another story to tell behind that as well, </p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">though, ’cause I was dating another girl a few years </p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">later who had actually gone overseas as an </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">exchange student.      This was 1981 I think.</p><p class="p8 c1" style="position:absolute;left:4.000px;top:422.312px;"><bdi><span class="c2 c3" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">I remember as clear as today, for whatever </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:446.284px;">reason but I wasn’t saved then, but I really had this </p><p class="p8" style="position:absolute;left:4.000px;top:470.256px;">passion for Missy. I really loved her, and I really </p><p class="p8" style="position:absolute;left:4.000px;top:494.228px;">felt way down deep in my heart that she would be </p><p class="p8" style="position:absolute;left:4.000px;top:518.200px;">my wife.</p><p class="p8" style="position:absolute;left:4.000px;top:542.172px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>You know when you got it bad….</bdi></p></div></div></body></html>
