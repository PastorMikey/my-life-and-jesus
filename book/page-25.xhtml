<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>25 Page 25 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:33.549px;top:13.500px;width:352.902px;height:568.000px;"><img src="images/image-31.png" alt="The Old Tabernacle of Grace… The Old Tabernacle of Grace&#10;&#9;Now, there’s a lot of things that happened over he years while we was at that church in Pineland. We began to do a lot of traveling, and one of the places that we frequented was the Vichy Church of God Campground up by Rolla, Missouri. &#10;&#9;There is an old barn there that served as the main tabernacle, It’s probably about 60 feet wide and probably 80 feet long or so. An old hay barn from the 1800s.&#10;&#9;That’s where they had church. No air conditioning, no fans, just an old pole barn, beat-up pews, bunch of hay all over the place, and a stage up in the front. The front stage of the church was probably about 3 feet high. &#10;It was dimly Lit with old hanging lights that few know how old they were.&#10;At Night a Perfect Missouri breeze blow thru it.&#10;&#9;I’ll tell you, if there was ever a place that I felt the presence of God and I could hear Him talk to me…. This was it. &#10;If there is any place I grew more spiritually and in God’s Grace…, it was at that Church campground." style="width:352.902px;height:568.000px;"/></span></p><div style="position:absolute;left:33.549px;top:13.500px;width:352.902px;height:568.000px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">The Old Tabernacle of Grace</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px ss="p8" style="position:absolute;left:4.000px;top:374.368px;">It was dimly Lit with old hanging lights that few </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">know how old they were.</p><p class="p8" style="position:absolute;left:4.000px;top:422.312px;">At Night a Perfect Missouri breeze blow thru it.</p><p class="p8" style="position:absolute;left:4.000px;top:446.284px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I’ll tell you, if there was ever a place that I felt </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:470.256px;">the presence of God and I could hear Him talk to </p><p class="p8" style="position:absolute;left:4.000px;top:494.228px;">me…. This was it. </p><p class="p8" style="position:absolute;left:4.000px;top:518.200px;">If there is any place I grew more spiritually and in </p><p class="p8" style="position:absolute;left:4.000px;top:542.172px;">God’s Grace…, it was at that Church campground.</p></div></div></body></html>
