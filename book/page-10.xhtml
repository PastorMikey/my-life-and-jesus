<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>10 Page 10 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:30.768px;top:28.998px;width:358.465px;height:537.004px;"><img src="images/image-11.png" alt="God’s hands at Work… God’s hands at Work&#10;&#9;        Let’s go back to 1983&#10;&#9;I did a few years in the Oil field, Chain Hand, Lead tong to Motorman an the Derek hand… I lost my pinky making up pipe with a chain ( didn’t use a Kelly spinner then)  (which I attribute to I stole some tools and after this I felt it was my punishment, Please remember I am still not what you can call a Saved man,,)&#10;&#9;Turned back to welding and chasing turnarounds which I learned in my Dad’s machine shop, along with a ton of Machinist skill sets…&#10;&#9;Jobs in Lake Charles were hard to find and folks&#10;wasn’t hiring, and work was tough, and things weren’t  going right. And I felt like, you know what? If I just had  a little place, I can start my own business and maybe  do alright, after all work’n for someone else ain’t work’n Out-     right?  &#10;&#9;Being blinded to the elements of all of the things of being self-employed.. it was a dream Idea.." style="width:358.465px;height:537.004px;"/></span></p><div style="position:absolute;left:30.768px;top:28.998px;width:358.465px;height:537.004px;"><p class="p8 p16" style="position:absolute;left:4.000px;top:4.000px;">God’s hands at Work</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>        Let’s go back to 1983</bdi></p><p class="p8 c1" style="position:absolute;left:4.000px;top:62.732px;"><bdi><span class="c2" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">I did a few years in the Oil field, Chain Hand, </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">Lead tong to Motorman an the Derek hand… I lost </p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">my pinky making up pipe with a chain ( didn’t use a </p><p class="p8 c1" style="position:absolute;left:4.000px;top:134.648px;"><span class="c2">Kelly spinner then)  </span><span class="c2 c6">(which I attribute to I stole some </span></p><p class="p8 p17 c6" style="position:absolute;left:4.000px;top:158.620px;">tools and after this I felt it was my punishment, </p><p class="p8 p17 c6" style="position:absolute;left:4.000px;top:182.592px;">Please remember I am still not what you can call a </p><p class="p8 p17 c6" style="position:absolute;left:4.000px;top:206.564px;">Saved man,,)</p><p class="p8 c1" style="position:absolute;left:4.000px;top:230.536px;"><bdi><span class="c2 c6" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">Turned back to welding and chasing </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">turnarounds which I learned in my Dad’s machine </p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">shop, along with a ton of Machinist skill sets…</p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>Jobs in Lake Charles were hard to find and folks</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">wasn’t hiring, and work was tough, and things </p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">weren’t  going right. And I felt like, you know what? </p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">If I just had  a little place, I can start my own </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">business and maybe  do alright, after all work’n for </p><p class="p8" style="position:absolute;left:4.000px;top:422.312px;">someone else ain’t work’n Out-     right?  </p><p class="p8" style="position:absolute;left:4.000px;top:446.284px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>Being blinded to the elements of all of the things </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:470.256px;">of being self-employed.. it was a dream Idea..</p></div></div></body></html>
