<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>23 Page 23 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:29.675px;top:34.408px;width:360.650px;height:526.184px;"><img src="images/image-29.png" alt="1st of Many gifts and blessing.… 1st of Many gifts and blessing.&#10;&#9;At that little shop that we rented from Miss Dixie Sparks for about seven years. It didn’t make a whole lot of money, but God supplied all of our needs.&#10;&#9;I can remember a time in that little shop when me and my wife had done a lot of praying. We were short on money—short on money to pay bills and the rent for the shop. This fella walked in, and he asked us if we was the owner. We told him, “Yes, we was.”  And asked if we could help him out some how and he replied&#10;“Well, it ain’t how you can help me. But what I have,”  I’ve got a set of keys in my hand and here they are.” And he handed them to me.&#10;&#10;&#9;He said, “There’s a little yellow Toyota up the road that’s broke down for the last time on me.” He said, “Here’s the title. here’s the keys It’s yours. Do what you want to do with it.”&#10;Stuned and excited we thanked him and he left… never to be seen again.&#10;" style="width:360.650px;height:526.184px;"/></span></p><div style="position:absolute;left:29.675px;top:34.408px;width:360.650px;height:526.184px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">1st of Many gifts and blessing.</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>At that little shop that we rented from Miss Dixie </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">Sparks for about seven years. It didn’t make a whole </p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">lot of money, but God supplied all of our needs.</p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I can remember a time in that little shop when </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;">me and my wife had done a lot of praying. We were </p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">short on money—short on money to pay bills and the </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">rent for the shop. This fella walked in, and he asked </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">us if we was the owner. We told him, “Yes, we was.”  </p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;">And asked if we could help him out some how and </p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">he replied</p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">“Well, it ain’t how you can help me. But what I </p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;">have,”  I’ve got a set of keys in my hand and here </p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">they are.” And he handed them to me.</p><p class="p8 c1" style="position:absolute;left:4.000px;top:350.396px;"> </p><p class="p8 c1" style="position:absolute;left:4.000px;top:370.796px;"><bdi><span class="c2 c3" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">He said, “There’s a little yellow Toyota up the </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:394.768px;">road that’s broke down for the last time on me.” He </p><p class="p8" style="position:absolute;left:4.000px;top:418.740px;">said, “Here’s the title. here’s the keys It’s yours. Do </p><p class="p8" style="position:absolute;left:4.000px;top:442.712px;">what you want to do with it.”</p><p class="p8" style="position:absolute;left:4.000px;top:466.684px;">Stuned and excited we thanked him and he left… </p><p class="p8" style="position:absolute;left:4.000px;top:490.656px;">never to be seen again.</p></div></div></body></html>
