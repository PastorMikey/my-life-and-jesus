<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>28 Page 28 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:29.713px;top:25.721px;width:360.574px;height:543.559px;"><img src="images/image-33.png" alt="Troubled Times… Troubled Times&#10;Then I got the mindset that when all the old brothers in the Bible would fall into trouble, they laid out stones as places of a memorial, then they would do what they felt they could do to get a hold of God.&#10;&#9;And I began to pray harder than I ever had…&#10;And I began to look into the depths of my heart and my soul, and I began to examine me. Whatever fault that I had, whatever I felt was a sin or could lead to sin, whatever anger and bitterness, lust, or whatever it was—every time I’d pick up a rock.. Not just any rock but one the size an shape I thought my problem was…&#10;&#9;I thought about everything I could come up with that would hinder my prayer, anything against my brother, whatever it was, I put it down in the creek.&#10;&#9;I don’t really know how long I was there, but I&#10;was there long enough that when I got done praying I felt I had finally reached Heaven. I was crying, and I was happy. I was shaking with fear, not knowing exactly what I was supposed to do with the rest of my life. " style="width:360.574px;height:543.559px;"/></span></p><div style="position:absolute;left:29.713px;top:25.721px;width:360.574px;height:543.559px;"><p class="p8 p13 c1" style="position:absolute;left:4.000px;top:4.000px;"><span class="c11">Troubled Times</span></p><p class="p8" style="position:absolute;left:4.000px;top:35.160px;">Then I got the mindset that when all the old brothers </p><p class="p8" style="position:absolute;left:4.000px;top:59.132px;">in the Bible would fall into trouble, they laid out </p><p class="p8" style="position:absolute;left:4.000px;top:83.104px;">stones as places of a memorial, then they would do </p><p class="p8" style="position:absolute;left:4.000px;top:107.076px;">what they felt they could do to get a hold of God.</p><p class="p8" style="position:absolute;left:4.000px;top:131.048px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>And I began to pray harder than I ever had…</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:155.020px;">And I began to look into the depths of my heart and </p><p class="p8" style="position:absolute;left:4.000px;top:178.992px;">my soul, and I began to examine me. Whatever fault </p><p class="p8" style="position:absolute;left:4.000px;top:202.964px;">that I had, whatever I felt was a sin or could lead to </p><p class="p8" style="position:absolute;left:4.000px;top:226.936px;">sin, whatever anger and bitterness, lust, or whatever </p><p class="p8" style="position:absolute;left:4.000px;top:250.908px;">it was—every time I’d pick up a rock.. Not just any </p><p class="p8" style="position:absolute;left:4.000px;top:274.880px;">rock but one the size an shape I thought my problem </p><p class="p8" style="position:absolute;left:4.000px;top:298.852px;">was…</p><p class="p8" style="position:absolute;left:4.000px;top:322.824px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I thought about everything I could come up with </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:346.796px;">that would hinder my prayer, anything against my </p><p class="p8" style="position:absolute;left:4.000px;top:370.768px;">brother, whatever it was, I put it down in the creek.</p><p class="p8" style="position:absolute;left:4.000px;top:394.740px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I don’t really know how long I was there, but I</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:418.712px;">was there long enough that when I got done praying </p><p class="p8" style="position:absolute;left:4.000px;top:442.684px;">I felt I had finally reached Heaven. I was crying, and </p><p class="p8" style="position:absolute;left:4.000px;top:466.656px;">I was happy. I was shaking with fear, not knowing </p><p class="p8" style="position:absolute;left:4.000px;top:490.628px;">exactly what I was supposed to do with the rest of </p><p class="p8" style="position:absolute;left:4.000px;top:514.600px;">my life. </p></div></div></body></html>
