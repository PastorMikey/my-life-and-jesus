<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>17 Page 17 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:22.316px;top:7.744px;width:359.367px;height:565.262px;"><img src="images/image-21.png" alt="We’ll Go…… &#9;We’ll Go…&#10;&#9;So, it’s kind of funny, but at the end of the day, you gotta realize what was happening. And I just didn’t understand it THEN. It was just kind of weird.&#10;&#9;But we’ll continue and get to the point….&#10;&#9;So we went to church that night.&#9;The Pastor, Brother Clarence Campbell, and his wife, Marybeth Campbell, was the piano player. There was a bunch of folks there that I didn’t know.&#10;&#9;I remember the brother preaching a message, and I was sitting in the back row, as usual. You know, newcomers, they sit in the&#10;back. Nowadays we call them backsliders, pews, ’cause a lot of folks get closer to the door before they leave the church.&#10;&#9;But we won’t go down that road. LOL….&#10;&#9;I remember when Marybeth got up and was playing a song, and I think—I think it was “Jesus is calling.” But I distinctly remember that I just about couldn’t get up to the altar fast enough. &#10;&#9;I just knew that God was dealing with me and talking to my heart. And all I wanted to do was get saved. " style="width:359.367px;height:565.262px;"/></span></p><div style="position:absolute;left:22.316px;top:7.744px;width:359.367px;height:565.262px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>We’ll Go…</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:33.000px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>So, it’s kind of funny, but at the end of the day, </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:56.972px;">you gotta realize what was happening. And I just </p><p class="p8" style="position:absolute;left:4.000px;top:80.944px;">didn’t understand it THEN. It was just kind of weird.</p><p class="p8 c1" style="position:absolute;left:4.000px;top:104.916px;"><bdi><span class="c2" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2 c8">But we’ll continue and get to the point….</span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:128.888px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>So we went to church that night.</bdi><bdi><span style="display:inline-block;overflow:hidden;width:8.512px;tab-size:86;">	</span></bdi><bdi>The Pastor, </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:152.860px;">Brother Clarence Campbell, and his wife, Marybeth </p><p class="p8" style="position:absolute;left:4.000px;top:176.832px;">Campbell, was the piano player. There was a bunch </p><p class="p8" style="position:absolute;left:4.000px;top:200.804px;">of folks there that I didn’t know.</p><p class="p8 c1" style="position:absolute;left:4.000px;top:224.776px;"><bdi><span class="c2 c3" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">I remember the brother preaching a message, </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:248.748px;">and I was sitting in the back row, as usual. You </p><p class="p8" style="position:absolute;left:4.000px;top:272.720px;">know, newcomers, they sit in the</p><p class="p8" style="position:absolute;left:4.000px;top:296.692px;">back. Nowadays we call them backsliders, pews, </p><p class="p8" style="position:absolute;left:4.000px;top:320.664px;">’cause a lot of folks get closer to the door before they </p><p class="p8" style="position:absolute;left:4.000px;top:344.636px;">leave the church.</p><p class="p8 p21" style="position:absolute;left:4.000px;top:368.608px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>But we won’t go down that road. LOL….</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:392.580px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I remember when Marybeth got up and was </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:416.552px;">playing a song, and I think—I think it was “Jesus is </p><p class="p8" style="position:absolute;left:4.000px;top:440.524px;">calling.” But I distinctly remember that I just about </p><p class="p8" style="position:absolute;left:4.000px;top:464.496px;">couldn’t get up to the altar fast enough. </p><p class="p8" style="position:absolute;left:4.000px;top:488.468px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I just knew that God was dealing with me and </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:512.440px;">talking to my heart. And all I wanted to do was get </p><p class="p8" style="position:absolute;left:4.000px;top:536.412px;">saved. </p></div></div></body></html>
