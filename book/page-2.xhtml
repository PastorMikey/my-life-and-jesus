<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>2 Page 2 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:77.162px;top:17.906px;width:265.676px;height:131.766px;"><img src="images/Gpa.png" alt="Gpa.png" style="width:265.676px;height:131.766px;"/></span></p><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:47.900px;top:149.672px;width:340.199px;height:428.501px;"><img src="images/image-7.png" alt="The Start… The Start&#10;Funny thing about life is, once it starts, it just&#10;has an ending point. What happens between the&#10;start and finish has a lot to do with where you go&#10;when you die.&#10;&#9;So, in life’s journey, we have this life to live, a&#10;life to die for, a life of self-sacrifice, giving up on&#10;some of the dreams that we had for some of the&#10;dreams that really matter.&#10;&#9;God didn’t call us into this world to be self-&#10;serving, but what He wanted and what He asked&#10;for is somebody that would be willing to drag&#10;that cross of self-denial through to the finish.&#10;And in all the attributes of life that we have—the&#10;challenges that we face, the discouragement that&#10;comes our way—we have this hope within us,&#10;brighter than a perfect day, as the song says.&#10;&#10;" style="width:340.199px;height:428.501px;"/></span></p><div style="position:absolute;left:47.900px;top:149.672px;width:340.199px;height:428.501px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">The Start</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;">Funny thing about life is, once it starts, it just</p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">has an ending point. What happens between the</p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">start and finish has a lot to do with where you go</p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">when you die.</p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>So, in life’s journey, we have this life to live, a</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">life to die for, a life of self-sacrifice, giving up on</p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">some of the dreams that we had for some of the</p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">dreams that really matter.</p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>God didn’t call us into this world to be self-</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">serving, but what He wanted and what He asked</p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">for is somebody that would be willing to drag</p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;">that cross of self-denial through to the finish.</p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">And in all the attributes of life that we have—the</p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">challenges that we face, the discouragement that</p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">comes our way—we have this hope within us,</p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">brighter than a perfect day, as the song says.</p></div></div></body></html>
