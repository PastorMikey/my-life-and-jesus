<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>4 Page 4 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:35.391px;top:21.759px;width:349.219px;height:551.483px;"><img src="images/image-9.png" alt="Childhood &amp; 1st Love… Childhood &amp; 1st Love&#10;&#9;I can remember, as a kid, all of the little things&#10;in life that mattered, and it made sense.  I didn’t have no worries of tomorrow. I didn’t have to worry about work.&#10;&#9; If I needed money, I’d just go ask my Mom or Dad they’d oftentimes direct me to the work that needed to be done, or chores. Nothing was free, and we worked for everything we got. &#10;&#9;If we wanted anything extra, then again, we’d have to work for it.&#10; &#9;I remember washing everybody’s cars and trucks,  my whole family from Grandparents to Aunt’s and Uncles or anyone with a car…That was an opportunity that helped to teach me how to drive… without a license. &#10;&#9;I was a 15 year old boy having fun even if it was just to back it up a little bit. I feel like I was accomplishing something. &#10;&#9;As I got older, I realized that everything had a cost, Everything had some type of financial obligation to be able to do anything.&#10;" style="width:349.219px;height:551.483px;"/></span></p><div style="position:absolute;left:35.391px;top:21.759px;width:349.219px;height:551.483px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">Childhood &amp; 1st Love</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I can remember, as a kid, all of the little things</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">in life that mattered, and it made sense.  I didn’t </p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">have no worries of tomorrow. I didn’t have to </p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">worry about work.</p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi> If I needed money, I’d just go ask my Mom or </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">Dad they’d oftentimes direct me to the work that </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">needed to be done, or chores. Nothing was free, </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">and we worked for everything we got. </p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>If we wanted anything extra, then again, we’d </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">have to work for it.</p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;"><bdi> </bdi><bdi><span style="display:inline-block;overflow:hidden;width:24.318px;tab-size:244;">	</span></bdi><bdi>I remember washing everybody’s cars and </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;">trucks,  my whole family from Grandparents to </p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">Aunt’s and Uncles or anyone with a car…That was </p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">an opportunity that helped to teach me how to </p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">drive… without a license. </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I was a 15 year old boy having fun even if it was </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:422.312px;">just to back it up a little bit. I feel like I was </p><p class="p8" style="position:absolute;left:4.000px;top:446.284px;">accomplishing something. </p><p class="p8 c1" style="position:absolute;left:4.000px;top:470.256px;"><bdi><span class="c2" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">As I got older, I realized that everything had a </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:494.228px;">cost, Everything had some type of financial </p><p class="p8 c1" style="position:absolute;left:4.000px;top:518.200px;"><span class="c2">obligation to be able to do anything.</span></p></div></div></body></html>
