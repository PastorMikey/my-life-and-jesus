<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>13 Page 13 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:32.955px;top:24.467px;width:354.090px;height:303.465px;"><img src="images/image-17.png" alt="Time to break a Promise… Time to break a Promise&#10;&#9;Like I said God had a plan and He moved us around because he KNEW I was gonna NEED a lot more than mechanics and welding and what carpentry skills my Daddy taught us..&#10;&#9; If you don’t understand how God works I pray you understand this one thing… He allows us to make our own choices but in the same time line He’s constantly trying to guide us along our journey… He LOVES YOU just like He does me… &#10;&#9;Some of us are extra slow at learning or listening for His still small voice.." style="width:354.090px;height:303.465px;"/></span></p><div style="position:absolute;left:32.955px;top:24.467px;width:354.090px;height:303.465px;"><p class="p4 p18" style="position:absolute;left:4.000px;top:4.000px;">Time to break a Promise</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>Like I said God had a plan and He moved us </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">around because he KNEW I was gonna NEED a lot </p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">more than mechanics and welding and what </p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">carpentry skills my Daddy taught us..</p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi> If you don’t understand how God works I pray </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">you understand this one thing… He allows us to </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">make our own choices but in the same time line </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">He’s constantly trying to guide us along our </p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;">journey… He LOVES YOU just like He does me… </p><p class="p8 p19" style="position:absolute;left:4.000px;top:254.508px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>Some of us are extra slow at learning or listening </bdi></p><p class="p8 p19" style="position:absolute;left:4.000px;top:278.480px;">for His still small voice..</p></div><div style="display:none;left:50.889px;top:338.684px;width:318.223px;height:256.316px;" dir="ltr" id="gallery-7" class="gallery" data-current-item-index="0" aria-label="Image gallery" role="group"><div style="left:0;top:0;width:318.223px;height:204.316px;" class="gallery-image-viewfinder"><div class="gallery-image-roll"><div class="gallery-image-cropper"><span style="left:-114.061px;top:0;width:546.344px;height:204.316px;background-image:url(images/3_crosses.png);" class="gallery-full-image" aria-label="Caption" role="img"> </span></div></div><span style="display:block;border-radius:15px;outline-offset:-4px;" class="gallery-button-goToPrev" aria-label="Previous image" role="button"/><span style="display:block;border-radius:15px;outline-offset:-4px;" class="gallery-button-goToNext" aria-label="Next image" role="button"/></div><div style="left:0;top:210.316px;width:318.223px;height:26.000px;" class="gallery-caption-viewfinder"><div class="gallery-caption-roll"><
