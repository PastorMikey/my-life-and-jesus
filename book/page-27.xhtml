<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>27 Page 27 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:30.455px;top:13.070px;width:359.090px;height:541.438px;"><img src="images/image-33.png" alt="Troubled Times… Troubled Times&#10;&#9;Now, I can remember a time that I had been going&#10; through something. My wife and I were going through a lot of Business Struggles, Life Struggles and you name it. And it was almost I just couldn’t hear God somehow.&#10;&#9; I just felt like we were overshadowed by doubt and despair. And the devil was having a heyday in broke pockets…, and I just could not break through.&#10;If memory serves me right it seemed like this was going on for six or eight months leading up to this particular camp meeting,, which is the first weekend in August every year. It’s been there since the late 1800’s or so..&#10;&#9;But there is a dry creek bed out in the woods. &#10;And there’s lots of nice smooth round rocks and boulders, under the shade of nice trees and no one around, well I found out there a special spot and I sat down and begin to talk to God about everything, I just fell down and I started praying with all my heart…" style="width:359.090px;height:541.438px;"/></span></p><div style="position:absolute;left:30.455px;top:13.070px;width:359.090px;height:541.438px;"><p class="p4 p13 c1" style="position:absolute;left:4.000px;top:4.000px;"><span class="c11">Troubled Times</span></p><p class="p8 c1" style="position:absolute;left:4.000px;top:35.160px;"><bdi><span class="c2 c3" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">Now, I can remember a time that I had been </span></bdi></p><p class="p8" style="position:absolute;left:4.000px;top:59.132px;">going</p><p class="p8" style="position:absolute;left:4.000px;top:83.104px;"> through something. My wife and I were going </p><p class="p8" style="position:absolute;left:4.000px;top:107.076px;">through a lot of Business Struggles, Life Struggles </p><p class="p8" style="position:absolute;left:4.000px;top:131.048px;">and you name it. And it was almost I just couldn’t </p><p class="p8" style="position:absolute;left:4.000px;top:155.020px;">hear God somehow.</p><p class="p8" style="position:absolute;left:4.000px;top:178.992px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi> I just felt like we were overshadowed by doubt </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:202.964px;">and despair. And the devil was having a heyday in </p><p class="p8" style="position:absolute;left:4.000px;top:226.936px;">broke pockets…, and I just could not break through.</p><p class="p8" style="position:absolute;left:4.000px;top:250.908px;">If memory serves me right it seemed like this was </p><p class="p8" style="position:absolute;left:4.000px;top:274.880px;">going on for six or eight months leading up to this </p><p class="p8" style="position:absolute;left:4.000px;top:298.852px;">particular camp meeting,, which is the first weekend </p><p class="p8" style="position:absolute;left:4.000px;top:322.824px;">in August every year. It’s been there since the late </p><p class="p8" style="position:absolute;left:4.000px;top:346.796px;">1800’s or so..</p><p class="p8" style="position:absolute;left:4.000px;top:370.768px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>But there is a dry creek bed out in the woods. </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:394.740px;">And there’s lots of nice smooth round rocks and </p><p class="p8" style="position:absolute;left:4.000px;top:418.712px;">boulders, under the shade of nice trees and no one </p><p class="p8" style="position:absolute;left:4.000px;top:442.684px;">around, well I found out there a special spot and I </p><p class="p8" style="position:absolute;left:4.000px;top:466.656px;">sat down and begin to talk to God about everything, </p><p class="p8" style="position:absolute;left:4.000px;top:490.628px;">I just fell down and I started praying with all my </p><p class="p8" style="position:absolute;left:4.000px;top:514.600px;">heart…</p></div></div></body></html>
