style="position:absolute;left:4.000px;top:110.676px;">I said, “Lord, I have nothing else to give but me.”</p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;">“ And if You want me, then here I am. But You gotta </p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">guide my path. You gotta set every footstep that I </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">make, every thought that I have, every breath I </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">breathe, and everything I look at.</p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>“Lord, help it to be acceptable in Your sight, and </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;"><bdi>You guide me, please.”</bdi><bdi><span style="display:inline-block;overflow:hidden;width:17.612px;tab-size:177;">	</span></bdi><bdi>I’ll tell you that all these </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">years later, God still talks to  me every day, every step, </p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;">every prayer, every thought. He’s never left me alone. </p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">He’s done everything for us, as long as I do </p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">everything He asked me to do”</p><p class="p8 c1" style="position:absolute;left:4.000px;top:374.368px;"> </p></div></div></body></html>
