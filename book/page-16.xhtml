<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>16 Page 16 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:30.727px;top:16.898px;width:358.547px;height:548.250px;"><img src="images/image-20.png" alt="We’ll Go…… We’ll Go…&#10;&#9;Christmas Day of 1988, I can remember&#9;everybody, as usual, gathered up at Granddaddy’s house. It just was one of them&#10;times when it seemed like everybody showed up.&#10;&#9;Grandpa was sitting in the living room in his little rocking chair, and he said, “You know, the only thing I want for Christmas from anybody in this house is this one thing: if y’all would just go to church with me tonight.” And it kind of hit me real close to my heart, and I said, “I’ll go.” (Because my wife, as usual, the one that’s got the common sense, the one that always has the right judgment, and suggesting for a while we need to go to Church.) &#10;&#9;Little did we know what was going to happen next and the  “We’ll go.” started  the biggest family curry you ever seen or heard in your life. All kinds of language, all kinds of raising of your voices. Lots of opinions were cast. And it all hinged around a statement my Brother Brian made “Well, you shouldn’t have to go to church just ’cause somebody asks you to.”" style="width:358.547px;height:548.250px;"/></span></p><div style="position:absolute;left:30.727px;top:16.898px;width:358.547px;height:548.250px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">We’ll Go…</p><p class="p8 c1" style="position:absolute;left:4.000px;top:33.000px;"><bdi><span class="c2 c3" style="display span class="c2">Little did we know what was going to happen </span></bdi></p><p class="p8 c1" style="position:absolute;left:4.000px;top:368.608px;"><span class="c2">next and the  “We’ll go.” st</span><span class="c2 c3">arted </span><span class="c2"> the biggest family </span></p><p class="p8" style="position:absolute;left:4.000px;top:392.580px;">curry you ever seen or heard in your life. All kinds </p><p class="p8" style="position:absolute;left:4.000px;top:416.552px;">of language, all kinds of raising of your voices. Lots </p><p class="p8" style="position:absolute;left:4.000px;top:440.524px;">of opinions were cast. And it all hinged around a </p><p class="p8" style="position:absolute;left:4.000px;top:464.496px;">statement my Brother Brian made “Well, you </p><p class="p8" style="position:absolute;left:4.000px;top:488.468px;">shouldn’t have to go to church just ’cause somebody </p><p class="p8" style="position:absolute;left:4.000px;top:512.440px;">asks you to.”</p></div></div></body></html>
