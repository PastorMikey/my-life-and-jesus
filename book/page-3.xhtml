<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>3 Page 3 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:46.137px;top:29.078px;width:327.727px;height:536.844px;"><img src="images/image-8.png" alt="The Start… The Start&#10;My life’s coming to an end. There’ll be a lot of&#10;unfinished songs, a lot of unfinished messages, a lot of things that folks will look back on and&#10;wonder, “What happened to him? Wonder what really went on in the man’s life.”&#10;&#10;&#9;I’d like to share that with you today, as we&#10;write it down in this book—not so much of a&#10;biography, but more of a testimony of the great things that God’s done in my life.&#10;&#10;&#9;Follow along, if you will. Be patient in the&#10;reading comprehension, what you see and&#10;understand, and allow God to guide your steps, your path each day, every breath you breathe, every moment you think, &#10;every thought you have.&#10;&#10;Life is a journey. Life is an unexpected turn of&#10;events that turn into great expectations.&#10;" style="width:327.727px;height:536.844px;"/></span></p><div style="position:absolute;left:46.137px;top:29.078px;width:327.727px;height:536.844px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">The Start</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;">My life’s coming to an end. There’ll be a lot of</p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">unfinished songs, a lot of unfinished messages, </p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">a lot of things that folks will look back on and</p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">wonder, “What happened to him? Wonder what </p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;">really went on in the man’s life.”</p><p class="p8 c1" style="position:absolute;left:4.000px;top:158.620px;"> </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I’d like to share that with you today, as we</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">write it down in this book—not so much of a</p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;">biography, but more of a testimony of the great </p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">things that God’s done in my life.</p><p class="p8 c1" style="position:absolute;left:4.000px;top:278.480px;"> </p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>Follow along, if you will. Be patient in the</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">reading comprehension, what you see and</p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">understand, and allow God to guide your steps, </p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">your path each day, every breath you breathe, </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">every moment you think, </p><p class="p8" style="position:absolute;left:4.000px;top:422.312px;">every thought you have.</p><p class="p8 c1" style="position:absolute;left:4.000px;top:446.284px;"> </p><p class="p8" style="position:absolute;left:4.000px;top:470.256px;">Life is a journey. Life is an unexpected turn of</p><p class="p8" style="position:absolute;left:4.000px;top:494.228px;">events that turn into great expectations.</p></div></div></body></html>
