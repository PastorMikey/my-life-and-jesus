 my life my seem boring to&#10;yours but we’re all heading down the same path..&#10;lol" style="width:358.081px;height:297.188px;"/></span></p><div style="position:absolute;left:30.959px;top:255.437px;width:358.081px;height:297.188px;"><p class="p8 p20 c1" style="position:absolute;left:4.000px;top:4.000px;"><bdi><span class="c2 c7" style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi><span class="c2">First job I’ve ever had working at that tiny </span></bdi></p><p class="p8 p20" style="position:absolute;left:4.000px;top:27.972px;">shop was laying underneath an old car that had a </p><p class="p8 p20" style="position:absolute;left:4.000px;top:51.944px;">transmission leak. We had pull it out. Didn’t have </p><p class="p8 p20" style="position:absolute;left:4.000px;top:75.916px;">much in the way of equipment except a handful of </p><p class="p8 p20" style="position:absolute;left:4.000px;top:99.888px;">tools—and it leaked transmission fluid</p><p class="p8 p20" style="position:absolute;left:4.000px;top:123.860px;">all over the floor, and it was a mess. Ruined my </p><p class="p8 p20" style="position:absolute;left:4.000px;top:147.832px;">clothes and grease and road dirt in my eyes, But it </p><p class="p8 p20" style="position:absolute;left:4.000px;top:171.804px;">was my very first $75 as a Self Employed man..</p><p class="p8 p20" style="position:absolute;left:4.000px;top:195.776px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>It was a start to a life that I didn’t realize how </bdi></p><p class="p8 p20" style="position:absolute;left:4.000px;top:219.748px;">far it was gonna bring me or what path I was on </p><p class="p8 p20" style="position:absolute;left:4.000px;top:243.720px;">but looking back.. I see the Hand of God on every</p><p class="p8 p20" style="position:absolute;left:4.000px;top:267.692px;">single step of the way….</p></div></div></body></html>
