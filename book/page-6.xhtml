<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml"><head><title>6 Page 6 | My Life and Jesus</title><link rel="stylesheet" href="css/book.css" type="text/css"/><script src="js/book.js"/><meta charset="UTF-8"/><meta name="EPB-UUID" content="3AFEF5DA-4030-4118-922B-3ACB3BDC69CA"/><meta name="viewport" content="width=420,height=595"/></head><body dir="ltr" onload="Body_onLoad()"><div class="body" style="white-space:pre; line-break:strict;"><p style="font-size:1px;"><span style="display:inline-block;position:absolute;left:35.391px;top:35.912px;width:349.219px;height:523.175px;"><img src="images/image-11.png" alt="Childhood &amp; 1st Love… Childhood &amp; 1st Love&#10;&#9;I can remember, in her mom and daddy’s&#10;living room one night, nobody was around. &#10;I don’t know remember why I was there or if I stayed the  night with Rodney or what it was, &#10;but I remember bowing down on the couch, and I told God, if He could make my then girlfriend just kinda go away—not make her disappear, but just go away, you know—and open the door up that I could date Missy.&#10;(Granted she was dating another fella, and that&#10;too is another Long story…. )&#10;&#9;But back to my Praying to God. I told Him, I said,  “I believe I could marry her and be happy the rest of my life.”&#10;Not knowing, not knowing the journey that I was heading down.&#10;&#10;Well you guessed it, in 1982, March 3rd Missy&#10;turned 18, in May she Graduated High School&#10;and on August the 7th we got married.&#10;" style="width:349.219px;height:523.175px;"/></span></p><div style="position:absolute;left:35.391px;top:35.912px;width:349.219px;height:523.175px;"><p class="p10" style="position:absolute;left:4.000px;top:4.000px;">Childhood &amp; 1st Love</p><p class="p8" style="position:absolute;left:4.000px;top:38.760px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>I can remember, in her mom and daddy’s</bdi></p><p class="p8" style="position:absolute;left:4.000px;top:62.732px;">living room one night, nobody was around. </p><p class="p8" style="position:absolute;left:4.000px;top:86.704px;">I don’t know remember why I was there or if I </p><p class="p8" style="position:absolute;left:4.000px;top:110.676px;">stayed the  night with Rodney or what it was, </p><p class="p8" style="position:absolute;left:4.000px;top:134.648px;">but I remember bowing down on the couch, and I </p><p class="p8" style="position:absolute;left:4.000px;top:158.620px;">told God, if He could make my then girlfriend just </p><p class="p8" style="position:absolute;left:4.000px;top:182.592px;">kinda go away—not make her disappear, but just go </p><p class="p8" style="position:absolute;left:4.000px;top:206.564px;">away, you know—and open the door up that I could </p><p class="p8" style="position:absolute;left:4.000px;top:230.536px;">date Missy.</p><p class="p8" style="position:absolute;left:4.000px;top:254.508px;">(Granted she was dating another fella, and that</p><p class="p8" style="position:absolute;left:4.000px;top:278.480px;">too is another Long story…. )</p><p class="p8" style="position:absolute;left:4.000px;top:302.452px;"><bdi><span style="display:inline-block;overflow:hidden;width:28.000px;tab-size:280;">	</span></bdi><bdi>But back to my Praying to God. I told Him, I </bdi></p><p class="p8" style="position:absolute;left:4.000px;top:326.424px;">said,  “I believe I could marry her and be happy </p><p class="p8" style="position:absolute;left:4.000px;top:350.396px;">the rest of my life.”</p><p class="p8" style="position:absolute;left:4.000px;top:374.368px;">Not knowing, not knowing the journey that I was </p><p class="p8" style="position:absolute;left:4.000px;top:398.340px;">heading down.</p><p class="p8 p12 c1" style="position:absolute;left:4.000px;top:422.312px;"> </p><p class="p8" style="position:absolute;left:4.000px;top:439.112px;">Well you guessed it, in 1982, March 3rd Missy</p><p class="p8" style="position:absolute;left:4.000px;top:463.084px;">turned 18, in May she Graduated High School</p><p class="p8" style="position:absolute;left:4.000px;top:487.056px;">and on August the 7th we got married.</p></div></div></body></html>
